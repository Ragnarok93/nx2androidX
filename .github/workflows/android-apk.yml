# Builds the phone app (the APK) on GitHub: the payload (the rootfs the phone runs the tools with), the build tools,
# the app's assets and the APK itself (packaging/android-apk/build_apk.sh). The desktop bundles are the other
# workflows' (release-windows.yml, release-macos.yml).
#
# The payload release (NixPort/nixport-rootfs) is public; GitHub's built-in token can download it.
# No custom NIXPORT_TOKEN secret is required for test or release builds.
#
# The build is the release variant: the APK a player installs, signed with the project's own key (the secret
# NX2A_KEYSTORE_B64), so it installs over an earlier one instead of beside it.
#
# The APK is the run's artifact (nx2android-android-apk), and a published release gets it as an asset named
# after the version (nx2android-v0.3.0-alpha02.apk).
#
# Pull requests targeting android run regression tests and native link checks without signing credentials.
# Trusted push and dispatch runs build a signed APK. Only tagged builds attach it to a release.
#
# A tag's build also tells the QQ group: the announcement (the version, the release's Chinese changelog, the
# release's page and the netdisk link) goes out once the APK is attached. It is an extra: it never fails the
# build. The bot's tickets are the repository's secrets (QQBOT_APP_ID, QQBOT_APP_SECRET, QQBOT_GROUP_OPENID).
name: Android app

on:
  workflow_dispatch:   # a build of the branch, kept as the run's artifact
  pull_request:
    branches: [android]
    paths:
      - 'android/**'
      - 'porter/**'
      - 'packaging/android-apk/**'
      - 'nxnative/dm/android/**'
      - 'nxnative/dm/gfx/tools/**'
      - 'nxnative/dm/gfx/nvn/**'
      - 'nxnative/dm/tools/**'
      - 'nxnative/scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/resolution-scaling-validation.yml'
  push:
    # Trusted android and resolution development branch changes build upgradeable APKs.
    branches: [android, feature/universal-gsr2-20261124, fix/android-split-export-storage-20261128]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'porter/**'
      - 'packaging/android-apk/**'
      - 'nxnative/dm/android/**'
      - 'nxnative/dm/gfx/tools/**'
      - 'nxnative/dm/gfx/nvn/**'
      - 'nxnative/dm/tools/**'
      - 'nxnative/scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/resolution-scaling-validation.yml'

permissions:
  contents: write   # the release's assets (the APK)

jobs:
  resolution-validation:
    uses: ./.github/workflows/resolution-scaling-validation.yml
    permissions:
      contents: read
  apk:
    needs: resolution-validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'   # the Python the build scripts run on
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'       # the Android Gradle plugin's Java
      - name: verify and prepare the repository signing key
        if: github.event_name != 'pull_request'
        env:
          NX2A_KEYSTORE_B64: ${{ secrets.NX2A_KEYSTORE_B64 }}
          NX2A_KEYSTORE_PASSWORD: ${{ secrets.NX2A_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$NX2A_KEYSTORE_B64" || -z "$NX2A_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Set NX2A_KEYSTORE_B64 and NX2A_KEYSTORE_PASSWORD in the repository's Actions secrets."
            exit 1
          fi

          expected=$(cat packaging/android-apk/signing-cert.sha256)
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid release certificate pin."
            exit 1
          fi

          umask 077
          keyfile="$RUNNER_TEMP/nx2android.keystore"
          trap 'rm -f -- "$keyfile"' EXIT
          printf '%s' "$NX2A_KEYSTORE_B64" | base64 --decode > "$keyfile"
          candidate=$(keytool -exportcert -keystore "$keyfile" -alias nx2android \
            -storepass:env NX2A_KEYSTORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
          if [[ "$candidate" != "$expected" ]]; then
            echo "::error::Repository signing certificate $candidate does not match the pinned release certificate $expected."
            exit 1
          fi
          printf 'NX2A_KEYSTORE=%s\n' "$keyfile" >> "$GITHUB_ENV"
          trap - EXIT
          echo "Verified repository signing certificate: $candidate"
      - uses: android-actions/setup-android@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # the extractor and the shader translator are C#
      - name: the SDK parts the build needs
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.3.13750724"
          # Process substitution avoids 'yes' exiting 141 on SIGPIPE under
          # GitHub's bash -e -o pipefail when sdkmanager has finished reading.
          sdkmanager --licenses < <(yes) > /dev/null
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar" || {
            echo "::error::Android SDK 37.0 is missing after sdkmanager install"
            exit 1
          }
      # the payload and the build tools do not depend on the repository: they are fetched once and kept
      - uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: |
            packaging/android-apk/.cache/payload-arm64.tar.gz
            packaging/android-apk/.cache/toolchain
            packaging/android-apk/.cache/debs
            packaging/android-apk/.cache/nuget
          key: nx2a-android-payload-v1
      - name: the tests
        run: |
          python -m pip install -r requirements.txt
          dotnet restore nxnative/dm/tools/nx_extract/nx_extract.csproj
          python -m unittest discover tests
      - name: native host link smoke (prevent game APK loader crashes)
        run: |
          # The builder APK does not include libdmhost.so: each exported game
          # compiles its own. Build a real standalone host here and require all
          # symbols to resolve BEFORE accepting the porter test artifact.
          # Also link the headless dmhost (used for Oodle shader decoding)
          # and libdmplay.so: the two use front_player.c, not front_android.c.
          python nxnative/dm/android/build.py \
            --game 0100000000010000 \
            --ndk "$ANDROID_HOME/ndk/27.3.13750724" \
            --out "$RUNNER_TEMP/nx2a-native-host-smoke" \
            --exe --lib --play --release --jobs 4
          so="$RUNNER_TEMP/nx2a-native-host-smoke/libdmhost.so"
          test -s "$so"
          test -s "$RUNNER_TEMP/nx2a-native-host-smoke/dmhost"
          test -s "$RUNNER_TEMP/nx2a-native-host-smoke/libdmplay.so"
          nmtool="$ANDROID_HOME/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$nmtool" -D --undefined-only "$so" | tee "$RUNNER_TEMP/nx2a-native-undef.txt"
          ! grep -E '\b(dm_haptics_android_device|dm_haptics_android_device_player)\b' "$RUNNER_TEMP/nx2a-native-undef.txt"
          # Java's static native methods use dynamic symbol lookup after
          # System.loadLibrary("dmhost"). The linker succeeding is insufficient
          # if -fvisibility=hidden or llvm-strip hides the JNI entry points.
          "$nmtool" -D --defined-only "$so" | tee "$RUNNER_TEMP/nx2a-native-exports.txt"
          for symbol in ANativeActivity_onCreate \
                        Java_org_nx2a_GameActivity_embeddedPackReady \
                        Java_org_nx2a_GameActivity_companionPackReady \
                        Java_org_nx2a_GameActivity_diagnosticsExported \
                        Java_org_nx2a_GameActivity_losslessDllReady; do
            if ! awk '{print $NF}' "$RUNNER_TEMP/nx2a-native-exports.txt" | grep -Fxq "$symbol"; then
              echo "::error::Native game host is missing required export: $symbol"
              exit 1
            fi
          done
      - name: build the signed app
        if: github.event_name != 'pull_request'
        run: |
          export DOTNET="$(which dotnet)"
          bash packaging/android-apk/build_apk.sh release
        env:
          GH_TOKEN: ${{ github.token }}   # built-in token can download the public payload release
          NX2A_KEYSTORE_PASSWORD: ${{ secrets.NX2A_KEYSTORE_PASSWORD }}
          NX2A_KEY_PASSWORD: ${{ secrets.NX2A_KEY_PASSWORD }}
      - name: the APK's name
        if: github.event_name != 'pull_request'
        id: apk
        run: |
          # The name carries the version, the way the desktop bundles' names do: a build of a tag gets the
          # tag's own name, a build of the branch the version the app says.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ver="${{ github.ref_name }}"
          else
            ver="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)"
          fi
          echo "name=nx2android-${ver}.apk" >> "$GITHUB_OUTPUT"
          echo "name: nx2android-${ver}.apk"
      - name: the APK
        if: github.event_name != 'pull_request'
        run: ls -la android/app/build/outputs/apk/release/*.apk
      - name: verify the APK and signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          certs=$("$signer" verify --min-sdk-version 26 --print-certs "$apk")
          actual=$(sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' <<< "$certs")
          expected=$(cat packaging/android-apk/signing-cert.sha256)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK must have one signer matching the pinned release certificate $expected."
            exit 1
          fi
          echo "Verified APK signing certificate: $actual"
      - name: remove the runner keystore
        if: always() && github.event_name != 'pull_request'
        run: rm -f -- "$RUNNER_TEMP/nx2android.keystore"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: nx2android-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The release is made right after the tag is pushed, so it may not be there yet: wait for it, then
          # attach the APK to it. A release that never shows up leaves the APK in the run's artifact.
          for i in $(seq 1 36); do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then break; fi
            sleep 10
          done
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::warning::the release ${{ github.ref_name }} is not there yet: the APK stays as this run's artifact"
            exit 0
          fi
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/${{ steps.apk.outputs.name }}"
          gh release upload "${{ github.ref_name }}" "android/app/build/outputs/apk/release/${{ steps.apk.outputs.name }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: startsWith(github.ref, 'refs/tags/')
        name: the QQ group's announcement
        # The announcement is an extra: a refused token, a group that took the bot out, a link the platform
        # refuses - none of it may fail the release's build.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python devtools/qq_release_announce.py announce --tag "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          QQBOT_APP_ID: ${{ secrets.QQBOT_APP_ID }}
          QQBOT_APP_SECRET: ${{ secrets.QQBOT_APP_SECRET }}
          QQBOT_GROUP_OPENID: ${{ secrets.QQBOT_GROUP_OPENID }}
