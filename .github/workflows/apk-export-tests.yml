name: APK exporter regression tests

on:
  push:
    branches:
      - feature/removable-sd-apk-export-20261118
    paths:
      - 'porter/**'
      - 'tests/**'
      - '.github/workflows/apk-export-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exporter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Set up Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check APK size recovery, streaming and signing
        run: |
          python -m unittest discover -s tests -p 'test_apk_storage_recovery.py' -v
          python -m unittest discover -s tests -p 'test_apk_streaming.py' -v
