name: Reconstruction validation
on:
  workflow_dispatch:
  push:
    branches: [feature/universal-gsr2-20261124]
    paths:
      - '.github/workflows/reconstruction-validation.yml'
      - 'nxnative/dm/android/gfx_vk*'
      - 'nxnative/dm/android/shaders/**'
      - 'devtools/trace_reconstruction.py'
      - 'tests/*reconstruction*'
      - 'tests/*spatial_upscaler*'
      - 'tests/test_vk_output_present.py'
      - 'tests/test_vk_guest_temporal_replay.py'
      - 'tests/vk_gsr2_probe.inc'
permissions:
  contents: read
jobs:
  host-and-vulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install reconstruction host dependencies
        run: python3 -m pip install lz4
      - name: Install software Vulkan and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslc spirv-tools
      - name: Host reconstruction and diagnostic regressions
        run: |
          set -eux
          PYTHONPATH=. python3 tests/run_reconstruction_host.py
      - name: Real Vulkan readbacks at standard and larger extents
        shell: bash
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export VK_LAYER_ENABLES=VK_VALIDATION_FEATURE_ENABLE_SYNCHRONIZATION_VALIDATION_EXT
          python3 tests/run_vk_spatial_upscaler.py
          python3 tests/run_vk_spatial_upscaler.py --gsr2
          DM_TEST_LARGE_RECONSTRUCTION=1 python3 tests/run_vk_spatial_upscaler.py --gsr2 2>&1 | tee "$RUNNER_TEMP/reconstruction-large.log"
          grep -Fx "supersampling 2x checkerboard resolve PASS" "$RUNNER_TEMP/reconstruction-large.log"
          if grep -E 'Validation Error|SYNC-HAZARD' "$RUNNER_TEMP/reconstruction-large.log"; then exit 1; fi
          for mode in Bilinear 'FSR 1' 'GSR 1' 'GSR 2'; do
            grep -Fx "downsample $mode 1280x720 readback PASS" "$RUNNER_TEMP/reconstruction-large.log"
            for size in 1280x720 1920x1080 2560x1440 3840x2160; do
              grep -Fx "large $mode $size readback PASS" "$RUNNER_TEMP/reconstruction-large.log"
            done
            grep -Fx "supersampling $mode 3840x2160 -> 1920x1080 readback PASS" "$RUNNER_TEMP/reconstruction-large.log"
          done
  native-android-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
      - name: Install matching Android NDK
        run: sdkmanager 'ndk;27.3.13750724'
      - name: Build and link FFR Android native hosts
        run: |
          set -eux
          python3 nxnative/dm/android/build.py --game 0100606026F12000 \
            --ndk "$ANDROID_HOME/ndk/27.3.13750724" \
            --out "$RUNNER_TEMP/ffr-native" --exe --lib --play --release --jobs 4
          for name in dmhost libdmhost.so libdmplay.so; do
            test -s "$RUNNER_TEMP/ffr-native/$name"
          done
